name: iauso

x-runtime: &runtime
  image: iauso:1.2
  build: .
  user: "1000:1000"
  restart: unless-stopped
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  memswap_limit: 512m
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  logging:
    driver: json-file
    options:
      max-size: "2m"
      max-file: "3"

services:
  collector:
    <<: *runtime
    command: [python, -m, iauso, collect, --config, /app/docker/config.collector.json, --loop, --output, /public/snapshot.json]
    volumes:
      - ./docker/config.collector.json:/app/docker/config.collector.json:ro
      - ./server-data/home/.claude:/credentials/claude:ro
      - ./server-data/home/.codex:/credentials/codex:ro
      - ./server-data/state:/state
      - ./server-data/public:/public

  api:
    <<: *runtime
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"
    environment:
      APP_SNAPSHOT_FILE: /public/snapshot.json
      APP_API_TOKEN_FILE: /run/secrets/api_token
      APP_STALE_AFTER_SECONDS: "900"
    volumes:
      - ./server-data/public:/public:ro
    secrets:
      - api_token
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3

  auth:
    profiles: [auth]
    build:
      context: .
      dockerfile: docker/Dockerfile.auth
    user: "1000:1000"
    init: true
    stdin_open: true
    tty: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - ./server-data/home:/home/node

  # Renews the provider sessions before they expire, using the same image and
  # the same credentials volume as "auth". It needs no Docker socket and no
  # scheduler on the host: the loop lives inside the container. A refresh was
  # measured to fit in 512 MB, hence the modest limit.
  refresher:
    build:
      context: .
      dockerfile: docker/Dockerfile.auth
    command: [bash, /app/scripts/refresh_loop.sh]
    user: "1000:1000"
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    volumes:
      - ./server-data/home:/home/node
      - ./scripts/refresh_loop.sh:/app/scripts/refresh_loop.sh:ro
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

secrets:
  api_token:
    file: ./secrets/api-token
